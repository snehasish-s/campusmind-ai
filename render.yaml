services:
  - type: web
    name: campusmind-ai
    runtime: docker
    plan: free
    dockerfilePath: ./infra/render.Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: DEPLOYMENT_MODE
        value: render
      - key: DATABASE_URL
        sync: false
      - key: GRAPH_CHECKPOINT_URL
        sync: false
      - key: APP_ORIGIN
        sync: false
      - key: SECURE_COOKIES
        value: "true"
      - key: STORAGE_BACKEND
        value: supabase
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: campusmind-private
      - key: BOOTSTRAP_TOKEN
        generateValue: true
      - key: QUEUE_MODE
        value: sync
      - key: RATE_LIMIT_BACKEND
        value: database
      - key: AI_MODE
        value: fallback
      - key: EMBEDDING_MODE
        value: keyword
      - key: LANGSMITH_TRACING
        value: "false"
      - key: SMTP_HOST
        value: ""
      - key: AUTOMATION_ENABLED
        value: "true"
      - key: AUTOMATION_INTERVAL_SECONDS
        value: "60"
      - key: PAYMENT_PROVIDER
        value: demo
